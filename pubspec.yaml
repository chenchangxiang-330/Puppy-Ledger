name: puppy_ledger
description: 温暖、离线、只属于你的小狗账本。
publish_to: none
version: 0.1.9+10

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/puppy_pair.png
    - assets/illustrations/puppy_peach.png
    - assets/illustrations/puppy_sage.png
    - assets/avatars/golden_coin.jpg
    - assets/avatars/white_coin.jpg
